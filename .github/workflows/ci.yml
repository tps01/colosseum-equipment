name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Checkout core dependency
        uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: .deps/colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .deps/colosseum-core
          python -m pip install -e ".[test,static]"
          python -m pip check
      - name: Test
        run: pytest -q
      - name: Package metadata
        run: |
          python -c "from importlib.metadata import entry_points; import colosseum_equipment; assert colosseum_equipment.__version__ == '0.1.4'; assert any(ep.name == 'equipment' for ep in entry_points(group='colosseum.plugins'))"
      - name: Static
        run: |
          ruff check colosseum_equipment
          mypy
