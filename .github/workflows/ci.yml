name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Checkout core dependency
        uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: .deps/colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .deps/colosseum-core
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Test
        # Exclude @pytest.mark.gui (Tk display); those skip locally without a display too.
        run: pytest -q -m "not gui"
      - name: Package metadata
        run: |
          python -c "from importlib.metadata import entry_points; import colosseum_equipment; assert colosseum_equipment.__version__; assert any(ep.name == 'equipment' for ep in entry_points(group='colosseum.plugins'))"
      - name: Static
        run: |
          ruff check colosseum_equipment
          mypy

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [scpi_binary, ubx_stream, mask_validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Checkout core dependency
        uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: .deps/colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -e .deps/colosseum-core
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Fuzz ${{ matrix.target }}
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_WORK: ${{ github.workspace }}/.fuzz-work
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .fuzz-work
          python tests/fixtures/fuzz/run.py -max_total_time=30 2>&1 | tee .fuzz-work/fuzz.log
      - name: Preserve fuzz failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-${{ matrix.target }}
          path: .fuzz-work/
          include-hidden-files: true
          if-no-files-found: ignore

  # Confirm the API pages build. Publishing stays on the develop pages workflow.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Checkout core dependency
        uses: actions/checkout@v7
        with:
          repository: tps01/colosseum-core
          ref: develop
          path: .deps/colosseum-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python -m pip install -U pip setuptools wheel
          python -m pip install "sphinx>=7.0,<9"
          python -m pip install -e .deps/colosseum-core
          python -m pip install -r requirements.txt
      - name: Build documentation
        run: python scripts/build_pages.py
