# Example NI USB-6501 + USB-8452 IO layout (not wired to a hardware run).
# Requires NI-DAQmx and NI-845x installed.
# First-contact addressing: use the USB resource string from NI-VISA / MAX
# (USB0::...). MAX aliases still work if that is what the SDK open string is.

[[io.dio]]
dio_id = 1
driver = "ni-6501"
resource = "USB0::0x3923::0x718A::01A12345::RAW"
port_lines = 24
direction = 0x0000FF
drive = "open-drain"
initial_output = 0x000000

[[io.dio]]
dio_id = 2
driver = "ni-845x"
resource = "USB0::0x3923::0x12D8::01B67890::RAW"
model = "usb-8452"
port_lines = 8
direction = 0x0F
drive = "push-pull"
voltage = 3.3
initial_output = 0x00

[io.i2c]
i2c_id = 1
driver = "ni-845x"
resource = "USB0::0x3923::0x12D8::01B67890::RAW"
model = "usb-8452"
voltage = 3.3
clock_hz = 100000
address = 0x50
address_bits = 7
pullup = true
timeout_ms = 500

[io.spi]
spi_id = 1
driver = "ni-845x"
resource = "USB0::0x3923::0x12D8::01B67890::RAW"
model = "usb-8452"
voltage = 3.3
clock_hz = 1000000
mode = 0
chip_select = 0
bits_per_word = 8
timeout_ms = 500
