# Example bench configuration for examples/*.py
# Paths are illustrative; adjust resources to your lab.

[[equipment.psu]]
psu_id = 1
model = generic  # or tdk-genesys
interface = usb
resource = USB0::0x1234::0x5678::INSTR
voltage = 3.3
ovp = 3.6
ocp = 1.0

[[equipment.psu]]
psu_id = 2
model = generic  # or tdk-genesys
interface = serial
resource = COM5
voltage = 12.0
ovp = 12.4
ocp = 3.0

[equipment.dmm]
dmm_id = 1
model = generic  # or keysight-edu34450a
interface = usb
resource = USB0::0x2A8D::0x8F01::INSTR
timeout = 5.0

[equipment.serial]
serial_id = 1
port = COM4
baudrate = 115200
timeout = 2.0

[shared.ssh]
ssh_id = 1
host = 192.168.1.100
port = 22
username = root
key_filename = ""  # set path to key, or use password below
password = ""
timeout = 30.0
