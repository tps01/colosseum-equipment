spec: "1.0"
devices:
  keysight_n5171b_sg:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "Keysight Technologies,N5171B,MY00000002,A.15.00"
      - q: "*RST"
      - q: "*CLS"
      - q: "*OPC?"
        r: "1"
      - q: "*ESR?"
        r: "0"
      - q: "*STB?"
        r: "0"
      - q: "SYST:ERR?"
        r: "0,No error"
      - q: "INIT:CONT OFF"
      - q: "INIT:IMM"
    properties:
      cw_freq:
        default: 1000000000.0
        getter:
          q: "FREQ:CW?"
          r: "{:.6f}"
        setter:
          q: "FREQ:CW {:.6f}"
        specs:
          type: float
      power_dbm:
        default: -10.0
        getter:
          q: "POW:AMPL?"
          r: "{:.3f}"
        setter:
          q: "POW:AMPL {:.3f}"
        specs:
          type: float
      output_state:
        default: 0
        getter:
          q: "OUTP:STAT?"
          r: "{:.0f}"
        setter:
          q: "OUTP:STAT {:.0f}"
        specs:
          type: int
          valid: [0, 1]
      alc_state:
        default: 1
        getter:
          q: "POW:ALC?"
          r: "{:.0f}"
        setter:
          q: "POW:ALC {:.0f}"
        specs:
          type: int
          valid: [0, 1]
resources:
  GPIB::14::INSTR:
    device: keysight_n5171b_sg
