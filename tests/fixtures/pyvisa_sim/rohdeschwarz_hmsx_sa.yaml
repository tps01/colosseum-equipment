spec: "1.0"
devices:
  rohdeschwarz_hmsx_sa:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "Rohde&Schwarz,HMS-X,123456,02.000"
      - q: "*RST"
      - q: "*CLS"
      - q: "*OPC?"
        r: "1"
      - q: "*ESR?"
        r: "0"
      - q: "*STB?"
        r: "0"
      - q: "SYST:ERR:NEXT?"
        r: "0,No error"
      - q: "TRIG:SOFT"
    properties:
      trig_source:
        default: IMM
        getter:
          q: "TRIG:SOUR?"
          r: "IMM"
        setter:
          q: "TRIG:SOUR {}"
        specs:
          type: str
          valid: ["IMM", "EXT", "VID"]
      trig_slope:
        default: POS
        getter:
          q: "TRIG:SLOP?"
          r: "POS"
        setter:
          q: "TRIG:SLOP {}"
        specs:
          type: str
          valid: ["POS", "NEG"]
      rbw:
        default: 100000.0
        getter:
          q: "BAND:RBW?"
          r: "{:.6f}"
        setter:
          q: "BAND:RBW {:.6f}"
        specs:
          type: float
      vbw:
        default: 1000.0
        getter:
          q: "BAND:VBW?"
          r: "{:.6f}"
        setter:
          q: "BAND:VBW {:.6f}"
        specs:
          type: float
      center_freq:
        default: 100000000.0
        getter:
          q: "FREQ:CENT?"
          r: "{:.6f}"
        setter:
          q: "FREQ:CENT {:.6f}"
        specs:
          type: float
      span:
        default: 1000000.0
        getter:
          q: "FREQ:SPAN?"
          r: "{:.6f}"
        setter:
          q: "FREQ:SPAN {:.6f}"
        specs:
          type: float
resources:
  GPIB::13::INSTR:
    device: rohdeschwarz_hmsx_sa
