spec: "1.0"
devices:
  generic_dmm:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "Colosseum, Generic DMM (Simulated), 0002, 0.1.0"
      - q: "CONF:VOLT:DC"
    properties:
      reading:
        default: 3.3
        getter:
          q: "READ?"
          r: "{:.6E}"
        specs:
          type: float

resources:
  GPIB::2::INSTR:
    device: generic_dmm
