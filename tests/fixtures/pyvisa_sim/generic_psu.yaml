spec: "1.0"
devices:
  generic_psu:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "Colosseum, Generic PSU (Simulated), 0001, 0.1.0"
      - q: "OUTP ON"
        r: ""
      - q: "OUTP OFF"
        r: ""
    properties:
      voltage:
        default: 3.3
        getter:
          q: "VOLT?"
          r: "{:.6f}"
        setter:
          q: "VOLT {:.6f}"
        specs:
          type: float
      meas_voltage:
        default: 3.3
        getter:
          q: "MEAS:VOLT?"
          r: "{:.6f}"
        setter:
          q: "VOLT {:.6f}"
        specs:
          type: float
      current_limit:
        default: 1.0
        getter:
          q: "CURR?"
          r: "{:.6f}"
        setter:
          q: "CURR {:.6f}"
        specs:
          type: float

resources:
  GPIB::1::INSTR:
    device: generic_psu
