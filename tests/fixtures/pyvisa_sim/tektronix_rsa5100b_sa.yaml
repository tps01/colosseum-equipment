spec: "1.0"
devices:
  tektronix_rsa5100b_sa:
    eom:
      GPIB INSTR:
        q: "\n"
        r: "\n"
    error: ERROR
    dialogues:
      - q: "*IDN?"
        r: "TEKTRONIX,RSA5106B,MY00000003,1.0.0"
      - q: "*RST"
      - q: "*CLS"
      - q: "*OPC?"
        r: "1"
      - q: "INIT:CONT OFF"
      - q: "INIT:IMM"
      - q: "DISP:UPD OFF"
      - q: "DISP:UPD ON"
      - q: "DISP:WIND:ACT:MEAS?"
        r: "SPECtrum"
      - q: "CALC:MARK1:MAX"
      - q: "TRAC:DATA? TRACE1"
        r: "-38.0,-37.5,-36.0,-37.0,-39.0"
      - q: "FETCH:SPEC:IQ?"
        r: "#21234567890123456789012"
      - q: "FETCH:SGRam:TRAC?"
        r: "#210abcdefghij"
      - q: "SYST:ERR?"
        r: "0,No error"
    properties:
      center_freq:
        default: 1000000000.0
        getter:
          q: "DISP:SPEC:FREQ:OFFS?"
          r: "{:.6f}"
        setter:
          q: "DISP:SPEC:FREQ:OFFS {:.6f}"
        specs:
          type: float
      span:
        default: 10000000.0
        getter:
          q: "DISP:SPEC:FREQ:SCAL?"
          r: "{:.6f}"
        setter:
          q: "DISP:SPEC:FREQ:SCAL {:.6f}"
        specs:
          type: float
      rbw:
        default: 100000.0
        getter:
          q: "SENS:SPEC:BAND:RES?"
          r: "{:.6f}"
        setter:
          q: "SENS:SPEC:BAND:RES {:.6f}"
        specs:
          type: float
      marker_x:
        default: 1000000000.0
        getter:
          q: "CALC:MARK1:X?"
          r: "{:.6f}"
        specs:
          type: float
      marker_y:
        default: -38.0
        getter:
          q: "CALC:MARK1:Y?"
          r: "{:.3f}"
        specs:
          type: float
resources:
  GPIB::20::INSTR:
    device: tektronix_rsa5100b_sa
