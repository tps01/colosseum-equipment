[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-equipment"
version = "0.1.10"
description = "Colosseum equipment and I/O plugin (instruments, VISA/serial, DIO)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "colosseum-core>=0.16,<0.17",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pyftdi>=0.55,<1",
  "pyserial>=3.5,<4",
  "pyvisa>=1.15,<2",
  "pyvisa-sim>=0.7,<0.8",
  "scipy>=1.10,<2",
  "pytest>=8.0",
  "bandit[toml]>=1.7",
  "vulture>=2.11",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-pyserial",
]

[project.entry-points."colosseum.plugins"]
equipment = "colosseum_equipment:register"

[tool.setuptools.packages.find]
include = ["colosseum_equipment*"]

[tool.setuptools.package-data]
colosseum_equipment = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
markers = [
    "visa_sim: exercises the PyVISA-sim backend",
    "plot: exercises matplotlib plot generation (slower)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["colosseum_equipment"]

[tool.ruff.lint]
select = ["A", "BLE", "FBT", "N", "COM", "C4", "ISC", "ICN", "TID", "TCH", "E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "FBT", "E501"]
"colosseum_equipment/instruments/**" = ["N801", "N802", "FBT001", "FBT003", "A002", "BLE001", "E501"]
"colosseum_equipment/api/**" = ["N802", "A002", "FBT001"]
"colosseum_equipment/io/**" = ["FBT001", "A002", "A005"]
"colosseum_equipment/network/windows.py" = ["N801"]
"examples/**" = ["E501"]
"colosseum_equipment/autoconfig/**" = ["BLE001"]
"colosseum_equipment/transports/**" = ["BLE001", "ICN001"]
"colosseum_equipment/network/**" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum_equipment"]
exclude = ["tests/", "build/", "examples/"]
mypy_path = [
  ".deps/colosseum-core",
  "../colosseum-core",
]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "pyftdi.*",
  "scipy.*",
  "numpy.*",
  "matplotlib.*",
  "pyvisa.*",
  "pyvisa_sim.*",
  "serial.*",
  "tomli",
  "tomllib",
  "pytest",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs"]
