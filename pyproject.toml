[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-equipment"
version = "0.1.0"
description = "Colosseum equipment and I/O plugin (instruments, VISA/serial, DIO)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "colosseum-core>=0.15,<0.16",
  "colosseum-shared>=0.1,<0.2",
]

[project.optional-dependencies]
hardware = [
  "pyvisa>=1.15; python_version >= '3.10'",
  "pyvisa>=1.14,<1.15; python_version < '3.10'",
  "pyserial",
]
io = ["pyftdi>=0.55"]
plot = ["matplotlib"]
equipment-sim = ["pyvisa-sim>=0.7,<0.8; python_version >= '3.10'"]
test = [
  "pytest>=8.0",
  "pyvisa>=1.15; python_version >= '3.10'",
  "pyvisa>=1.14,<1.15; python_version < '3.10'",
  "pyvisa-sim>=0.7,<0.8; python_version >= '3.10'",
]
equipment = [
  "pyvisa>=1.15; python_version >= '3.10'",
  "pyvisa>=1.14,<1.15; python_version < '3.10'",
  "pyserial",
  "matplotlib",
]
static = [
  "bandit[toml]>=1.7",
  "vulture>=2.11",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-pyserial",
]

[project.entry-points."colosseum.plugins"]
equipment = "colosseum_equipment:register"

[project.entry-points."colosseum.docgen"]
equipment = "colosseum_equipment.docgen_entry:spec"

[tool.setuptools.packages.find]
include = ["colosseum_equipment*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
markers = [
    "visa_sim: requires pyvisa-sim (.[test] extra; Python 3.10+)",
    "plot: requires matplotlib save_plot path (slower)",
]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["colosseum_equipment"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum_equipment"]
exclude = ["tests/", "build/", "examples/"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "pyftdi.*",
  "scipy.*",
  "numpy.*",
  "matplotlib.*",
  "pyvisa.*",
  "pyvisa_sim.*",
  "serial.*",
  "pytest",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs"]
