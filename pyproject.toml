[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-equipment"
version = "0.12.1"
description = "Colosseum equipment and I/O plugin (instruments, VISA/serial, DIO)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "colosseum-core>=0.18,<0.19",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pyftdi>=0.55,<1",
  "pyserial>=3.5,<4",
  "pyvisa>=1.15,<2",
  "pyvisa-sim>=0.7,<0.8",
  "scipy>=1.10,<2",
]

[project.entry-points."colosseum.plugins"]
equipment = "colosseum_equipment:register"

[tool.setuptools.packages.find]
include = ["colosseum_equipment*"]

[tool.setuptools.package-data]
colosseum_equipment = ["py.typed", "tools/mask_templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]
markers = [
    "visa_sim: exercises the PyVISA-sim backend",
    "plot: exercises matplotlib plot generation (slower)",
    "gui: opens a Tk window (skip in headless CI)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["colosseum_equipment"]

[tool.ruff.lint]
select = ["A", "BLE", "FBT", "N", "COM", "C4", "ISC", "ICN", "TID", "TCH", "E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "FBT", "E501", "N802"]
"colosseum_equipment/instruments/**" = [
  "N801", "N802", "FBT001", "FBT003", "A002", "BLE001", "E501",
  "ARG002", "SIM105", "SIM102", "TC001", "TC003", "C416", "B007", "F841", "I001",
]
"colosseum_equipment/api/**" = ["N802", "A002", "FBT001", "ANN202", "ANN401", "E501"]
"colosseum_equipment/tools/**" = ["BLE001", "ANN401", "N818", "FBT003", "SIM114"]
"colosseum_equipment/evidence.py" = ["ANN401"]
"colosseum_equipment/io/**" = ["FBT001", "A002", "A005"]
"colosseum_equipment/io/backends/ni/**" = ["N816", "SIM105"]
"colosseum_equipment/network/windows.py" = ["N801"]
"examples/**" = ["E501"]
"colosseum_equipment/autoconfig/**" = ["BLE001"]
"colosseum_equipment/transports/**" = ["BLE001", "ICN001", "RET501"]
"colosseum_equipment/network/**" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum_equipment"]
exclude = ["tests/", "build/", "examples/"]
mypy_path = [
  ".deps/colosseum-core",
  "../colosseum-core",
]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "pyftdi.*",
  "scipy.*",
  "numpy.*",
  "matplotlib.*",
  "customtkinter",
  "customtkinter.*",
  "pyvisa.*",
  "pyvisa_sim.*",
  "serial",
  "serial.*",
  "tomli",
  "tomllib",
  "pytest",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs"]
